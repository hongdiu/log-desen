name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  # 在 Windows runner 上用 Python 3.8 + PyInstaller 打包，
  # 产物兼容 win7 SP1（需目标机有 VC++ 2015-2019 运行时）。
  #
  # 【重要】不用 --onefile 模式！PyInstaller onefile 运行时会把内容解压到
  # %TEMP% 临时目录再执行，这个行为特征和恶意软件混淆壳高度相似，会被
  # Windows Defender / SmartScreen 100% 误判为病毒。
  # 改用 onedir 模式（默认）：生成一个文件夹，内含 exe + 依赖 dll，
  # 误报率极低，内网分发时整个文件夹拷过去即可。
  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install -r requirements.txt
      - name: Verify module import works
        shell: pwsh
        run: python -c "from log_desensitizer.gui import LogDesensitizerApp; print('import OK')"
      - name: Generate version info file
        shell: pwsh
        # PyInstaller --version-file 接受 UTF-8 文本，格式为 vsversioninfo
        # 有版本信息的 exe 被 Defender 信任度更高，减少误报。
        run: |
          @'
VSVersionInfo(
  ffi=FixedFileInfo(
    filevers=(1, 0, 0, 0),
    prodvers=(1, 0, 0, 0),
    mask=0x3f,
    flags=0x0,
    OS=0x40004,
    fileType=0x1,
    subtype=0x0,
    date=(0, 0)
  ),
  kids=[
    StringFileInfo([StringTable('080404B0', [
      String('CompanyName', 'LogDesensitizer'),
      String('FileDescription', '日志脱敏工具 - 正则+启发式识别敏感信息'),
      String('FileVersion', '1.0.0.0'),
      String('InternalName', 'log-desensitizer'),
      String('LegalCopyright', 'Copyright 2026'),
      String('OriginalFilename', 'log-desensitizer.exe'),
      String('ProductName', 'LogDesensitizer'),
      String('ProductVersion', '1.0.0.0')
    ])]),
    VarFileInfo([Var('Translation', [2052, 1200])])
  ]
)
'@ | Out-File -Encoding utf8 version_info.txt
      - name: Build exe (onedir, no onefile)
        shell: pwsh
        # onedir 模式（默认，去掉 --onefile）生成 dist/log-desensitizer/ 文件夹，
        # 内含 exe + 依赖 dll。误报率远低于 onefile。
        # --windowed 不弹黑色命令行窗口；
        # --collect-all regex 确保第三方 regex 库（含 C 扩展）打入；
        # --version-file 加版本信息减少 Defender 误报。
        run: pyinstaller --noconfirm --onedir --windowed --name log-desensitizer --collect-all log_desensitizer --collect-all regex --paths . --version-file version_info.txt log_desensitizer\__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: log-desensitizer-windows
          path: dist/log-desensitizer/
          if-no-files-found: error
