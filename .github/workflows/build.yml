name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  # 在 Windows runner 上用 Python 3.8 + PyInstaller 打包单 exe，
  # 产物兼容 win7 SP1（需目标机有 VC++ 2015-2019 运行时）。
  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install -r requirements.txt
      - name: Verify module import works
        shell: pwsh
        run: python -c "from log_desensitizer.gui import LogDesensitizerApp; print('import OK')"
      - name: Build exe
        shell: pwsh
        # __main__.py 已做兼容处理，这里走 script 入口更简单稳健（PyInstaller 各版本都支持）。
        # --paths . 确保 log_desensitizer 包可被搜索到；__main__.py 内部在 relative import 失败
        # 时会自动退化为绝对导入，因此 "No known parent package" 场景也能正常启动。
        run: pyinstaller --noconfirm --onefile --windowed --name log-desensitizer --collect-all log_desensitizer --paths . log_desensitizer\__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: log-desensitizer-windows
          path: dist/log-desensitizer.exe
          if-no-files-found: error
